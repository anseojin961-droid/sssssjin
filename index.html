<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>우리의 하루들</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #FBF5F0;
  --bg-tint: #F8E9E3;
  --bg-warm: #F2D9D1;
  --paper: #FFFBF8;
  --paper-2: #FFF6F1;

  --rose-50: #FCE9E5;
  --rose-100: #F7D2CB;
  --rose-200: #F0B3A8;
  --rose-300: #E89A8E;
  --rose-400: #DA7B6B;
  --rose-500: #C46055;
  --rose-600: #A04A45;
  --wine: #6B2737;
  --plum: #8B3A4A;

  --peach: #F5C9A8;
  --apricot: #F6B58A;
  --sage: #C9D2BC;
  --mist: #D6CFD8;
  --butter: #F3E2BC;

  --ink: #2C2025;
  --ink-2: #4B3940;
  --ink-3: #806B72;
  --ink-4: #B2A0A6;
  --line: rgba(122, 64, 70, 0.10);
  --line-2: rgba(122, 64, 70, 0.18);

  --sh-1: 0 1px 2px rgba(80, 30, 40, 0.04), 0 4px 12px rgba(80, 30, 40, 0.06);
  --sh-2: 0 4px 14px rgba(80, 30, 40, 0.08), 0 18px 40px -8px rgba(80, 30, 40, 0.10);
  --sh-glow: 0 0 0 1px rgba(255,255,255,0.6) inset, 0 8px 24px rgba(196, 96, 85, 0.18);

  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  --font-kr: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-en: "Outfit", "Pretendard Variable", system-ui, sans-serif;
  --font-display: "Fraunces", "Outfit", "Pretendard Variable", serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-kr);
  color: var(--ink);
  background: var(--bg-base);
  background:
    radial-gradient(1200px 600px at 20% 10%, #F8DDD4 0%, transparent 60%),
    radial-gradient(900px 600px at 80% 90%, #F1CFC8 0%, transparent 60%),
    linear-gradient(180deg, #F4E2DA 0%, #EDD1C6 100%);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
input, textarea, select { font-family: inherit; color: inherit; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* ─── Stage ─── */
.stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 40px 20px 80px;
}
.stage-inner { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
.stage-meta { max-width: 340px; padding-top: 40px; color: var(--ink-2); }
.stage-meta .brand { font-family: var(--font-display); font-weight: 500; font-size: 40px; letter-spacing: -0.02em; line-height: 1; color: var(--wine); }
.stage-meta .brand em { font-style: italic; font-weight: 400; }
.stage-meta .tag { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rose-500); margin-bottom: 14px; font-family: var(--font-en); font-weight: 500; }
.stage-meta .desc { margin-top: 18px; font-size: 14px; line-height: 1.7; color: var(--ink-3); }
.stage-meta .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.stage-meta .pill-list span { font-size: 11px; padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,0.65); border: 1px solid var(--line-2); color: var(--ink-2); font-family: var(--font-en); letter-spacing: 0.02em; }

@media (max-width: 900px) {
  .stage { padding: 0; }
  .stage-meta { display: none; }
  .stage-inner { gap: 0; }
}

/* ─── Phone Shell ─── */
.phone {
  width: 393px;
  height: 852px;
  border-radius: 54px;
  background: var(--bg-base);
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 0 12px #1c1418,
    0 0 0 13px #2a1f23,
    0 40px 80px -20px rgba(80, 30, 40, 0.4),
    0 80px 120px -40px rgba(80, 30, 40, 0.3);
  isolation: isolate;
}
@media (max-width: 900px) {
  .phone {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    box-shadow: none;
  }
}

/* Status Bar */
.statusbar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 54px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px 0;
  font-family: var(--font-en);
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  z-index: 50;
  pointer-events: none;
}
.dynamic-island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 122px; height: 36px; background: #0a0608; border-radius: 999px; z-index: 60;
}
.statusbar .right { display: flex; align-items: center; gap: 5px; }
.statusbar svg { display: block; }

.home-indicator {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; background: rgba(0,0,0,0.35); border-radius: 999px; z-index: 60;
}

/* ─── Screen Container ─── */
.screen-wrap {
  position: absolute; inset: 0;
  padding-top: 54px;
  display: flex; flex-direction: column;
}
.screen-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 102px;
  scroll-behavior: smooth;
}
.screen-scroll::-webkit-scrollbar { width: 0; }

.screen { display: none; }
.screen.active { display: block; animation: screenIn 0.35s cubic-bezier(.22,.61,.36,1); }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Page Header */
.page-header {
  padding: 14px 22px 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.page-header .h-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 24px;
  letter-spacing: -0.02em;
  color: var(--wine);
}
.page-header .h-title em { font-style: italic; font-weight: 400; }
.page-header .h-action { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 999px;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  color: var(--ink-2);
  transition: transform .15s ease, background .2s;
}
.icon-btn:hover { transform: scale(1.05); background: #fff; }
.icon-btn svg { width: 18px; height: 18px; }

/* ─── Bottom Nav ─── */
.tabbar {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 12px 26px;
  z-index: 40;
}
.tabbar-inner {
  background: rgba(255, 251, 248, 0.82);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 28px;
  padding: 8px;
  display: flex;
  justify-content: space-between;
  align-items: stretch;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 8px 28px rgba(140, 60, 70, 0.18),
    0 20px 60px -20px rgba(140, 60, 70, 0.25);
  position: relative;
}
.tab-item {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 22px;
  color: var(--ink-3);
  transition: color .2s;
  position: relative;
  z-index: 2;
}
.tab-item.active { color: var(--wine); }
.tab-item .ti-ico { width: 22px; height: 22px; display: grid; place-items: center; }
.tab-item .ti-ico svg { width: 22px; height: 22px; stroke-width: 1.6; }
.tab-item .ti-label { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; font-family: var(--font-en); }
.tab-item .ti-label.kr { font-family: var(--font-kr); font-size: 10px; }
.tab-indicator {
  position: absolute; top: 8px; bottom: 8px;
  width: calc(20% - 6px);
  background: linear-gradient(180deg, #FCE2DC, #F6CFC4);
  border-radius: 18px;
  z-index: 1;
  transition: left 0.38s cubic-bezier(.22,.61,.36,1);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 4px 14px rgba(196,96,85,0.18);
}

/* ─── Card Base ─── */
.card {
  background: var(--paper);
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  box-shadow: var(--sh-1);
}
.glass {
  background: rgba(255, 251, 248, 0.75);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.7);
}

.section { padding: 0 22px; margin-top: 18px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 10px;
}
.section-head .s-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--ink-2); text-transform: uppercase;
  font-family: var(--font-en);
}
.section-head .s-title.kr { font-family: var(--font-kr); letter-spacing: 0; font-size: 14px; }
.section-head .s-more { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 2px; }
.section-head .s-more svg { width: 12px; height: 12px; }

.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.center { display: grid; place-items: center; }
.muted { color: var(--ink-3); }
.mono { font-family: var(--font-en); font-variant-numeric: tabular-nums; }

/* ════════════════════════════════════════════
   HOME
   ════════════════════════════════════════════ */
.home-hero {
  margin: 8px 16px 0;
  border-radius: 28px;
  padding: 22px 22px 24px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(140% 90% at 100% 0%, #FBDDD3 0%, transparent 55%),
    radial-gradient(120% 80% at 0% 100%, #F4C7BD 0%, transparent 50%),
    linear-gradient(155deg, #FFF1EA 0%, #F8D9CF 100%);
  box-shadow: 0 12px 28px -10px rgba(180, 80, 70, 0.25);
  border: 1px solid rgba(255,255,255,0.6);
}
.home-hero::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 50% at 80% 20%, rgba(255,255,255,0.5), transparent 70%);
  pointer-events: none;
}
.hero-top {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12px;
  color: var(--ink-2);
  margin-bottom: 22px;
  position: relative; z-index: 2;
}
.hero-top .weather {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.7);
  padding: 6px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 500;
}
.hero-top .weather .temp { font-family: var(--font-en); font-weight: 600; }
.hero-top .greet { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }

.couple-stack {
  display: flex; align-items: center; justify-content: center; gap: 0;
  position: relative; z-index: 2;
  margin-bottom: 18px;
}
.avatar {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 4px solid #fff;
  box-shadow: 0 6px 18px rgba(180, 80, 70, 0.22);
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, var(--rose-100), var(--peach));
}
.avatar.a1 { transform: translateX(8px) rotate(-4deg); }
.avatar.a2 { transform: translateX(-8px) rotate(4deg); margin-left: -16px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar .ph {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  font-family: var(--font-en); font-weight: 600; font-size: 24px;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.avatar.a1 .ph { background: linear-gradient(135deg, #F4A89A, #DA7B6B); }
.avatar.a2 .ph { background: linear-gradient(135deg, #E89AB0, #C46055); }
.heart-link {
  position: absolute;
  width: 28px; height: 28px;
  background: #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  box-shadow: 0 4px 10px rgba(196, 96, 85, 0.3);
  z-index: 5;
  animation: heart-pulse 2.2s ease-in-out infinite;
}
.heart-link svg { width: 16px; height: 16px; color: var(--rose-400); }
@keyframes heart-pulse {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.15); }
  60% { transform: scale(0.97); }
}

.dday {
  text-align: center;
  position: relative; z-index: 2;
}
.dday .dday-label {
  font-family: var(--font-en);
  font-weight: 500; font-size: 10px;
  letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--rose-500);
}
.dday .dday-num {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 72px;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--wine);
  margin: 6px 0 4px;
  display: inline-flex; align-items: baseline; gap: 2px;
  font-feature-settings: "ss01" on;
}
.dday .dday-num .plus { font-size: 36px; vertical-align: top; opacity: 0.6; transform: translateY(-18px); font-style: italic; font-weight: 300; }
.dday .dday-num em { font-style: italic; font-weight: 300; }
.dday .dday-sub {
  font-size: 11px; color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 6px;
}
.dday .dday-sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--rose-300); }

/* Mood Card */
.mood-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.mood {
  border-radius: 22px;
  padding: 16px 14px 14px;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.6);
  cursor: pointer;
}
.mood.m1 { background: linear-gradient(155deg, #FFEFE8 0%, #FBD9CD 100%); }
.mood.m2 { background: linear-gradient(155deg, #FFE6EC 0%, #F7CAD4 100%); }
.mood .m-who {
  font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink-3);
  font-family: var(--font-en);
  margin-bottom: 8px;
}
.mood .m-emoji {
  font-size: 36px; line-height: 1; margin-bottom: 6px;
}
.mood .m-text {
  font-size: 12px; color: var(--ink-2);
  font-weight: 500;
}
.mood .m-time {
  font-size: 10px; color: var(--ink-4);
  margin-top: 4px;
  font-family: var(--font-en);
}

/* Quick Action Grid */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.quick {
  aspect-ratio: 1 / 1.05;
  border-radius: 20px;
  padding: 14px 12px;
  position: relative;
  display: flex; flex-direction: column; justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.7);
  box-shadow: 0 4px 14px -4px rgba(180, 80, 70, 0.15);
  transition: transform .25s cubic-bezier(.22,.61,.36,1), box-shadow .25s;
  cursor: pointer;
}
.quick:active { transform: translateY(1px); }
.quick:hover { transform: translateY(-3px); box-shadow: 0 10px 22px -6px rgba(180, 80, 70, 0.22); }
.quick.q-photo { background: linear-gradient(160deg, #FFE8DD 0%, #FBC9B6 100%); }
.quick.q-letter { background: linear-gradient(160deg, #FFE2E8 0%, #F8C2CF 100%); }
.quick.q-bucket { background: linear-gradient(160deg, #E8F0E0 0%, #C5D6B4 100%); }
.quick.q-schedule { background: linear-gradient(160deg, #FFF0CE 0%, #F4D896 100%); }
.quick.q-place { background: linear-gradient(160deg, #E6DEEC 0%, #C9BCD6 100%); }
.quick.q-game { background: linear-gradient(160deg, #FDE5D4 0%, #F5BFA0 100%); }
.quick .q-ico {
  width: 36px; height: 36px;
  border-radius: 12px;
  background: rgba(255,255,255,0.55);
  display: grid; place-items: center;
  backdrop-filter: blur(6px);
}
.quick .q-ico svg { width: 18px; height: 18px; stroke-width: 1.7; color: var(--ink); }
.quick .q-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.quick .q-count {
  position: absolute; top: 10px; right: 12px;
  font-family: var(--font-en);
  font-size: 11px; font-weight: 600;
  color: var(--ink-2);
  background: rgba(255,255,255,0.7);
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.02em;
}

/* Today's Question */
.qcard {
  border-radius: 24px;
  padding: 20px 20px 18px;
  background:
    radial-gradient(80% 60% at 100% 0%, #FFE2D8 0%, transparent 60%),
    linear-gradient(180deg, #FFFBF8 0%, #FCF0EA 100%);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
  box-shadow: var(--sh-1);
}
.qcard .q-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.qcard .q-tag {
  font-family: var(--font-en);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--rose-500);
  display: inline-flex; align-items: center; gap: 6px;
}
.qcard .q-tag::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--rose-400);
  box-shadow: 0 0 0 3px rgba(218,123,107,0.18);
}
.qcard .q-day {
  font-family: var(--font-en); font-size: 11px; color: var(--ink-3);
}
.qcard .q-body {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 22px;
  line-height: 1.35;
  letter-spacing: -0.01em;
  color: var(--wine);
  margin: 0 0 16px;
  position: relative;
}
.qcard .q-body::before {
  content: "\201C";
  position: absolute; left: -6px; top: -20px;
  font-size: 56px;
  color: var(--rose-200);
  font-family: var(--font-display);
  line-height: 1;
}
.qcard .q-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.qcard .q-status {
  font-size: 11px; color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 6px;
}
.qcard .q-status .av-mini {
  display: inline-flex;
}
.qcard .q-status .av-mini span {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid #FFFBF8;
  margin-left: -6px;
}
.qcard .q-status .av-mini span:first-child { margin-left: 0; background: linear-gradient(135deg, #F4A89A, #DA7B6B); }
.qcard .q-status .av-mini span:nth-child(2) { background: linear-gradient(135deg, #E89AB0, #C46055); }
.btn-answer {
  padding: 10px 18px; border-radius: 999px;
  background: linear-gradient(135deg, var(--rose-400), var(--rose-500));
  color: #fff;
  font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 6px 16px -2px rgba(196,96,85,0.35);
  transition: transform .15s;
}
.btn-answer:hover { transform: translateY(-1px); }
.btn-answer svg { width: 13px; height: 13px; }

/* Recent Activity */
.activity {
  padding: 16px 18px;
  border-radius: 22px;
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: var(--sh-1);
}
.activity .a-list { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.a-item { display: flex; align-items: center; gap: 12px; }
.a-item .a-thumb {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--rose-100), var(--peach));
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 18px;
}
.a-item .a-thumb.t-photo { background: linear-gradient(135deg, #FBC9B6, #F4A89A); }
.a-item .a-thumb.t-letter { background: linear-gradient(135deg, #F8C2CF, #E89AB0); }
.a-item .a-thumb.t-bucket { background: linear-gradient(135deg, #C5D6B4, #A9C290); }
.a-item .a-body { flex: 1; min-width: 0; }
.a-item .a-title { font-size: 13px; font-weight: 500; color: var(--ink); }
.a-item .a-meta { font-size: 11px; color: var(--ink-3); margin-top: 2px; font-family: var(--font-en); }
.a-item .a-time { font-size: 11px; color: var(--ink-4); font-family: var(--font-en); }

/* ════════════════════════════════════════════
   PHOTOS
   ════════════════════════════════════════════ */
.photos-filter {

.envelope {

function renderCalendar() {
  const firstDow = 5;
  const daysInMay = 31;
  const today = 26;
  const events = { 1: true, 8: true, 14: true, 17: true, 22: true, 25: true, 30: true };

  let cells = [];
  for (let i = 0; i < firstDow; i++) {
    const prev = 30 - firstDow + i + 1;
    cells.push(`<div class="cal-day muted"><span class="d-num">${prev}</span></div>`);
  }
  for (let d = 1; d <= daysInMay; d++) {
    const isToday = d === today;
    const hasEvent = events[d];
    const cls = ['cal-day'];
    if (isToday) cls.push('today');
    if (hasEvent) cls.push('has-event');
    cells.push(`<div class="${cls.join(' ')}"><span class="d-num">${d}</span>${hasEvent ? '<span class="d-dot"></span>' : ''}</div>`);

  const remaining = 42 - cells.length;
  for (let i = 1; i <= remaining; i++) {
    cells.push(`<div class="cal-day muted"><span class="d-num">${i}</span></div>`);
  }

  return `

/* ─── App Logic ─── */
const SCREENS = ['home', 'photos', 'calendar', 'letters', 'more'];

function setActiveScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + name);
  if (target) target.classList.add('active');

  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  const tab = document.querySelector(`.tab-item[data-tab="${name}"]`);
  if (tab) tab.classList.add('active');

  moveIndicator(name);
  document.getElementById('screenScroll').scrollTop = 0;
}

function moveIndicator(name) {
  const idx = SCREENS.indexOf(name);
  if (idx < 0) return;
  const ind = document.getElementById('tabIndicator');
  const tabbar = document.getElementById('tabbar');
  const innerW = tabbar.clientWidth - 16;
  const slot = innerW / 5;
  ind.style.width = (slot - 4) + 'px';
  ind.style.left = (8 + idx * slot + 2) + 'px';
}

function bindTabs() {
  document.querySelectorAll('.tab-item').forEach(t => {
    t.addEventListener('click', () => {
      setActiveScreen(t.dataset.tab);
    });
  });
}

function bindPhotoFav() {
  document.querySelectorAll('.photo').forEach(p => {
    p.addEventListener('click', () => {
      const fav = p.querySelector('.ph-fav');
      if (fav) {
        fav.remove();
      } else {
        const f = document.createElement('div');
        f.className = 'ph-fav';
        f.innerHTML = SVG.heart;
        p.appendChild(f);
      }
    });
  });
}

function bindEnvelopes() {
  document.querySelectorAll('.envelope').forEach(e => {
    e.addEventListener('click', () => {
      if (e.classList.contains('unread')) {
        e.classList.remove('unread');
        const badge = e.querySelector('.env-badge');
        if (badge) {
          badge.classList.remove('new');
          badge.classList.add('read');
          badge.textContent = '읽음';
        }
        const hint = e.querySelector('.env-hint');
        if (hint) {
          hint.innerHTML = '방금 읽음';
          hint.style.color = 'var(--ink-4)';
        }
      }
    });
  });
}

function bindChips() {
  document.querySelectorAll('.photos-filter .chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.photos-filter .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
    });
  });
}

const MOOD_EMOJIS = ['🥰','😊','☕️','🌸','✨','🌙','💭','🌿','🍃','🥹','😴','🥨'];
function bindMood() {
  document.querySelectorAll('.mood').forEach(m => {
    const emo = m.querySelector('.m-emoji');
    m.addEventListener('click', () => {
      const cur = emo.textContent.trim();
      const idx = MOOD_EMOJIS.indexOf(cur);
      const next = MOOD_EMOJIS[(idx + 1) % MOOD_EMOJIS.length];
      emo.textContent = next;
      emo.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }],
        { duration: 280, easing: 'cubic-bezier(.22,.61,.36,1)' }
      );
    });
  });
}

function bindLetterCounter() {
  const ta = document.getElementById('letterText');
  const len = document.getElementById('letterLen');
  if (ta && len) {
    ta.addEventListener('input', () => {
      len.textContent = ta.value.length + ' / 500';
    });
  }
}

/* ─── Tweaks / Palette ─── */
const PALETTES = {
  rose: {
    bg: '#FBF5F0', warm: '#F2D9D1',
    r400: '#DA7B6B', r500: '#C46055', wine: '#6B2737',
    stage: 'radial-gradient(1200px 600px at 20% 10%, #F8DDD4 0%, transparent 60%), radial-gradient(900px 600px at 80% 90%, #F1CFC8 0%, transparent 60%), linear-gradient(180deg, #F4E2DA 0%, #EDD1C6 100%)',
    name: 'Soft Rose'
  },
  peach: {
    bg: '#FBF3EC', warm: '#F5D9C2',
    r400: '#E59770', r500: '#C97550', wine: '#723526',
    stage: 'radial-gradient(1200px 600px at 20% 10%, #F8DCC6 0%, transparent 60%), radial-gradient(900px 600px at 80% 90%, #F0C9AC 0%, transparent 60%), linear-gradient(180deg, #F2DDC6 0%, #E8C9AB 100%)',
    name: 'Warm Peach'
  },
  wine: {
    bg: '#F5EDEE', warm: '#E5CCD2',
    r400: '#A0566A', r500: '#7E3849', wine: '#3F1A24',
    stage: 'radial-gradient(1200px 600px at 20% 10%, #E5C8CE 0%, transparent 60%), radial-gradient(900px 600px at 80% 90%, #D5AAB3 0%, transparent 60%), linear-gradient(180deg, #DDC2C9 0%, #C8A2AC 100%)',
    name: 'Deep Wine'
  },
  sand: {
    bg: '#F7F1E8', warm: '#E8D7BC',
    r400: '#C99A6B', r500: '#9E7148', wine: '#4A3220',
    stage: 'radial-gradient(1200px 600px at 20% 10%, #ECD6B8 0%, transparent 60%), radial-gradient(900px 600px at 80% 90%, #DBBC95 0%, transparent 60%), linear-gradient(180deg, #E5CCAA 0%, #D1B186 100%)',
    name: 'Sandy Cream'
  }
};

function applyPalette(key) {
  const p = PALETTES[key];
  if (!p) return;
  const r = document.documentElement.style;
  r.setProperty('--bg-base', p.bg);
  r.setProperty('--bg-warm', p.warm);
  r.setProperty('--rose-400', p.r400);
  r.setProperty('--rose-500', p.r500);
  r.setProperty('--wine', p.wine);
  document.body.style.background = p.stage + ' fixed';
}

function applyDdayStyle(style) {
  const dday = document.querySelector('.home-hero .dday');
  if (!dday) return;
  dday.classList.toggle('compact', style === 'compact');
}

function buildTweaks() {
  const state = { palette: 'rose', showActivity: true, ddayStyle: 'display' };

  const btn = document.createElement('button');
  btn.className = 'tweaks-toggle';
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.2 5.2 7.4 7.4M16.6 16.6 18.8 18.8M5.2 18.8 7.4 16.6M16.6 7.4 18.8 5.2"/></svg>';
  document.getElementById('phone').appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'tweaks-panel';
  panel.innerHTML = `
    <h4>Theme · 팔레트</h4>
    <div style="display:flex; gap:8px; margin-bottom: 12px;">
      ${Object.entries(PALETTES).map(([k, p]) => `
        <button class="tw-swatch ${k === state.palette ? 'active' : ''}" data-pal="${k}"
          style="background: linear-gradient(135deg, ${p.r400}, ${p.wine});"
          title="${p.name}"></button>
      `).join('')}
    </div>
    <div id="pal-name" style="font-size: 10px; color: var(--ink-3); margin-bottom: 12px; font-family: var(--font-en); letter-spacing: 0.04em;">
      ${PALETTES[state.palette].name}
    </div>
    <h4>D+day 스타일</h4>
    <div style="display: flex; gap: 6px; margin-bottom: 12px;">
      <button class="tw-btn" data-dd="display"
        style="flex:1; padding: 6px 10px; border-radius: 10px; font-size: 11px; background: var(--wine); color: #fff; border: 1px solid var(--line); cursor: pointer;">Display</button>
      <button class="tw-btn" data-dd="compact"
        style="flex:1; padding: 6px 10px; border-radius: 10px; font-size: 11px; background: rgba(255,255,255,0.7); color: var(--ink-2); border: 1px solid var(--line); cursor: pointer;">Compact</button>
    </div>
    <h4>최근 활동 표시</h4>
    <label style="display:flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; color: var(--ink-2);">
      <input type="checkbox" id="tw-activity" checked />
      <span>홈에 보이기</span>
    </label>
  `;
  document.getElementById('phone').appendChild(panel);

  btn.addEventListener('click', () => panel.classList.toggle('open'));

  panel.addEventListener('click', e => {
    const swatch = e.target.closest('.tw-swatch');
    if (swatch) {
      state.palette = swatch.dataset.pal;
      panel.querySelectorAll('.tw-swatch').forEach(s => s.classList.remove('active'));
      swatch.classList.add('active');
      panel.querySelector('#pal-name').textContent = PALETTES[state.palette].name;
      applyPalette(state.palette);
      return;
    }
    const ddBtn = e.target.closest('[data-dd]');
    if (ddBtn) {
      state.ddayStyle = ddBtn.dataset.dd;
      applyDdayStyle(state.ddayStyle);
      panel.querySelectorAll('[data-dd]').forEach(b => {
        const on = b.dataset.dd === state.ddayStyle;
        b.style.background = on ? 'var(--wine)' : 'rgba(255,255,255,0.7)';
        b.style.color = on ? '#fff' : 'var(--ink-2)';
      });
    }
  });

  const cb = panel.querySelector('#tw-activity');
  cb.addEventListener('change', () => {
    state.showActivity = cb.checked;
    const section = document.getElementById('activity-section');
    if (section) section.style.display = cb.checked ? '' : 'none';
  });

  applyPalette(state.palette);
  applyDdayStyle(state.ddayStyle);
}

/* ─── Compact D+day style ─── */
const compactCSS = document.createElement('style');
compactCSS.textContent = `
  .dday.compact .dday-num { font-size: 44px; }
  .dday.compact .dday-num .plus { font-size: 22px; transform: translateY(-10px); }
`;
document.head.appendChild(compactCSS);

/* ─── Init ─── */
window.addEventListener('DOMContentLoaded', () => {
  const root = document.getElementById('screens');
  root.innerHTML = [
    renderHome(),
    renderPhotos(),
    renderLetters(),
    renderCalendar(),
    renderMore()
  ].join('');

  bindTabs();
  bindPhotoFav();
  bindEnvelopes();
  bindChips();
  bindMood();
  bindLetterCounter();
  buildTweaks();

  setTimeout(() => moveIndicator('home'), 50);
  window.addEventListener('resize', () => {
    const activeTab = document.querySelector('.tab-item.active');
    if (activeTab) moveIndicator(activeTab.dataset.tab);
  });
});
</script>
